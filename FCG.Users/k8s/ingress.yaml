apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fcg-usersapi
  namespace: fcg-prod
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: usersapi
                port:
                  number: 80

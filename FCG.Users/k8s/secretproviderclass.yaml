apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: usersapi-kv
  namespace: fcg-prod
spec:
  provider: azure
  parameters:
    keyvaultName: "kv-fcg-prod-2532"
    tenantId: "8d75f1ef-d0ba-4752-be44-dbcf36105322"
    objects: |
      array:
        - |
          objectName: usersapi-connectionString
          objectType: secret
        - |
          objectName: usersapi-jwtIssuer
          objectType: secret
        - |
          objectName: usersapi-jwtKey
          objectType: secret

  secretObjects:
    - secretName: usersapi-secrets
      type: Opaque
      data:
        - objectName: usersapi-connectionString
          key: connectionString
        - objectName: usersapi-jwtIssuer
          key: jwtIssuer
        - objectName: usersapi-jwtKey
          key: jwtKey
